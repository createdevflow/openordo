listening-port=3478
tls-listening-port=5349
min-port=49152
max-port=65535

use-auth-secret
static-auth-secret=${TURN_SECRET}
realm=openordo.com

cert=/etc/letsencrypt/live/turn.openordo.com/fullchain.pem
pkey=/etc/letsencrypt/live/turn.openordo.com/privkey.pem

# Replace these with your VPS public IP
listening-ip=YOUR_VPS_PUBLIC_IP
relay-ip=YOUR_VPS_PUBLIC_IP

# Deny rules to prevent SSRF and abuse
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
no-multicast-peers

user-quota=10
total-quota=500
bps-capacity=5000000

fingerprint
no-cli
no-tlsv1
no-tlsv1_1
