
services:
  signaling:
    build: 
      context: ../../
      dockerfile: signaling/Dockerfile
    container_name: chartwell-signaling
    ports:
      - "4001:4001"
    env_file:
      - ../../.env
    environment:
      - NODE_ENV=production
      - API_URL=https://openordo.com
    restart: unless-stopped
    networks:
      - proxy
      - default
      - openordo_net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.videosignal.rule=(Host(`openordo.com`) || Host(`www.openordo.com`)) && PathPrefix(`/ws/signal`)"
      - "traefik.http.routers.videosignal.entrypoints=websecure"
      - "traefik.http.routers.videosignal.tls=true"
      - "traefik.http.routers.videosignal.tls.certresolver=le"
      - "traefik.http.routers.videosignal.priority=1000"
      - "traefik.http.routers.videosignal.service=videosignal"
      - "traefik.http.services.videosignal.loadbalancer.server.port=4001"

  coturn:
    image: coturn/coturn:latest
    container_name: chartwell-coturn
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/turnserver.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    env_file:
      - ../../.env
    restart: unless-stopped
    # Use network_mode: host because TURN requires large UDP port ranges which are inefficient to map in docker proxy

networks:
  proxy:
    external: true
  openordo_net:
    external: true
    name: openordo_internal_net
