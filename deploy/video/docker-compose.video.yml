version: "3.8"

services:
  signaling:
    build: 
      context: ../../signaling
    container_name: chartwell-signaling
    ports:
      - "4001:4001"
    environment:
      - NODE_ENV=production
      - SIGNAL_JWT_SECRET=${SIGNAL_JWT_SECRET}
      - API_URL=https://openordo.com
    restart: unless-stopped

  coturn:
    image: coturn/coturn:latest
    container_name: chartwell-coturn
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/turnserver.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    environment:
      - TURN_SECRET=${TURN_SECRET}
    restart: unless-stopped
    # Use network_mode: host because TURN requires large UDP port ranges which are inefficient to map in docker proxy
