name: Deploy to VPS

on:
  push:
    branches: [main]
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

# Cancel any in-progress deployment if a new push arrives
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  # ── Job 1: Validate (fast checks before deploying) ─────────────────────────
  validate:
    name: Type-check & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client (needed for type-check)
        run: npx prisma generate

      - name: TypeScript check
        run: npx tsc --noEmit

  # ── Job 2: Deploy (only after validate passes) ──────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: validate   # only run if validate succeeds

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     ${{ secrets.VPS_PORT }}
          script: |
            set -e  # Exit immediately on any error

            echo "📦 Navigating to project directory..."
            mkdir -p /var/www/openordo
            cd /var/www/openordo

            echo "🔄 Pulling latest code from main..."
            git fetch --all
            git reset --hard origin/main

            echo "🐳 Building and restarting containers..."
            docker compose up -d --build --remove-orphans

            echo "⏳ Waiting 10 seconds for database to initialize..."
            sleep 10

            echo "🔄 Pushing DB schema..."
            docker compose run --rm openordo-app npx --yes prisma db push --accept-data-loss

            echo "🧹 Pruning unused Docker images..."
            docker image prune -f

            echo "✅ Deployment complete!"
            echo "🌐 Web:    https://openordo.com"
            echo "🔑 Admin:  https://openordo.com/admin"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed! Check the logs above."
          exit 1
