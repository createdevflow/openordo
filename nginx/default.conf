server {
  listen 80;
  server_name _;

  client_max_body_size 25m;

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Serve uploaded files directly from the volume
  location /uploads/ {
    alias /var/www/uploads/;
    autoindex off;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  # WebSocket proxy for video signaling
  # Uses Docker's internal DNS (127.0.0.11) for dynamic hostname resolution
  # Both nginx and chartwell-signaling are on the 'proxy' Docker network
  resolver 127.0.0.11 valid=10s ipv6=off;
  location /ws/signal {
    set $signaling_host chartwell-signaling;
    proxy_pass http://$signaling_host:4001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 15s;
  }

  # Proxy everything else to Next.js
  location / {
    proxy_pass http://openordo-app:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
    proxy_connect_timeout 15s;
  }
}
